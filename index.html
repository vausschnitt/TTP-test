<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FloodRoute 3D – Kampar prototype</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;display:flex;height:100vh;color:#1a1a1a}
#side{width:340px;padding:12px;overflow:auto;border-right:1px solid #ddd;background:#fafafa}
#map{flex:1;height:100%}h1{font-size:18px;margin:0 0 2px}h2{font-size:14px;margin:14px 0 6px}
select,button,input{width:100%;padding:6px;margin:3px 0;font:inherit}
button{background:#0b6bcb;color:#fff;border:0;border-radius:4px;cursor:pointer}
.box{padding:8px;border-radius:4px;margin:6px 0;font-size:13px}
.ok{background:#e3f4e5}.warn{background:#fff3cd}.bad{background:#fde2e2}.info{background:#e7eefb}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #ddd;padding:3px;text-align:left}
.tag{padding:1px 6px;border-radius:8px;color:#fff;font-size:11px}
.node{width:12px;height:12px;border-radius:50%;background:#222;border:2px solid #fff;box-shadow:0 0 4px #0008}
@media(max-width:700px){body{flex-direction:column-reverse}#side{width:100%;height:50%}}
</style></head><body>
<div id="side">
<h1>FloodRoute 3D</h1><div style="color:#666">Kampar study area (demo graph)</div>
<div id="met" class="box info">MET warning: loading…</div>
<label><input type="checkbox" id="sim" style="width:auto"> Simulate MET flood/heavy-rain warning</label>
<div id="geo" class="box info" style="font-size:12px">Road shapes: loading…</div>

<h2>1. Route</h2>
<select id="from"></select><select id="to"></select>
<button id="go">Find route</button>
<button id="tilt" style="background:#555">Toggle 2D / 3D view</button>
<div id="result"></div>

<h2>2. Submit flood report</h2>
<select id="rroad"></select>
<select id="rstat"><option>PASSABLE</option><option>CAUTION</option><option>FLOODED</option></select>
<input id="rlvl" type="number" step="0.1" placeholder="Water level (m)">
<input id="rby" placeholder="Reported by" value="User01">
<button id="rsub">Submit report</button>

<h2>3. Admin dashboard</h2>
<div id="stats"></div>
<table><thead><tr><th>Time</th><th>Road</th><th>Status</th><th>m</th></tr></thead><tbody id="log"></tbody></table>
<button id="reset" style="background:#777;margin-top:8px">Reset demo data</button>
<p style="font-size:12px;color:#777">Tip: click empty map to see coordinates (use them to set real junctions). Routes are decision support only, not guaranteed safe.</p>
</div>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id),sim=$("sim");
// ---------- ROAD GRAPH (illustrative coords: replace with real Kampar junctions) ----------
const N={1:["UTAR Kampar",4.3385,101.1385],2:["North Jct",4.3300,101.1450],3:["Kampar Town",4.3053,101.1520],
4:["Bus Terminal",4.3030,101.1560],5:["Hospital Jct",4.3110,101.1480],6:["West Jct",4.3200,101.1380],
7:["Old Town",4.3000,101.1500],8:["South Jct",4.2920,101.1530],9:["Bandar Baru",4.3150,101.1600],
10:["East Jct",4.3220,101.1560],11:["Industrial",4.3080,101.1380],12:["Perak Rd Jct",4.2950,101.1420]};
// [a, b, name, lowLying]
const E=[[1,2,"Jln Univ",0],[2,6,"Jln West",0],[2,10,"Jln East",0],[6,11,"Jln Ind 1",0],[11,5,"Jln Hospital",0],
[5,3,"Jln Kampar (low)",1],[10,5,"Jln Link",0],[10,9,"Jln Baru",0],[9,4,"Jln Terminal",0],[3,4,"Jln Pasar",0],
[3,7,"Jln Lama (low)",1],[7,8,"Jln South",0],[7,12,"Jln Sungai (low)",1],[11,12,"Jln Ind 2 (low)",1],[12,8,"Jln Selatan",0],[4,8,"Jln Bypass",0]];
const COL={PASSABLE:"#2e9e44",CAUTION:"#e0a100",FLOODED:"#d32f2f"},MULT={PASSABLE:1,CAUTION:3,FLOODED:Infinity};
const ll=k=>[N[k][2],N[k][1]]; // [lng,lat]
const hav=(a,b)=>{const r=Math.PI/180,x=(N[b][2]-N[a][2])*r*Math.cos(N[a][1]*r),y=(N[b][1]-N[a][1])*r;return 6371*Math.hypot(x,y)};
// geometry cache: real road shapes fetched once from OSRM, then stored in the browser
let G={};try{G=JSON.parse(localStorage.getItem("fr_geom_v1"))||{}}catch(e){}
E.forEach(e=>{e.id=e[0]+"-"+e[1];if(G[e.id]){e.g=G[e.id].g;e.d=G[e.id].d}else{e.g=[ll(e[0]),ll(e[1])];e.d=hav(e[0],e[1])}});

// ---------- STATE ----------
let S;const KEY="floodroute_v1";
const seed=()=>({st:{"5-3":"FLOODED"},log:[{t:new Date().toISOString(),road:"5-3",s:"FLOODED",l:0.8,by:"Seed"}]});
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let metActive=false;
const status=e=>{let s=S.st[e.id]||"PASSABLE";
  if(s==="PASSABLE"&&e[3]&&(metActive||sim.checked))s="CAUTION";
  return s};

// ---------- ROUTING (Dijkstra) ----------
function dijkstra(src,dst,aware){
  const dist={},prev={},done={};Object.keys(N).forEach(k=>dist[k]=Infinity);dist[src]=0;
  while(true){let u=null;for(const k in dist)if(!done[k]&&(u===null||dist[k]<dist[u]))u=k;
    if(u===null||dist[u]===Infinity)break;if(u==dst)break;done[u]=1;
    for(const e of E){let v=e[0]==u?e[1]:e[1]==u?e[0]:null;if(v===null)continue;
      const c=e.d*(aware?MULT[status(e)]:1);if(dist[u]+c<dist[v]){dist[v]=dist[u]+c;prev[v]=[u,e]}}}
  if(dist[dst]===Infinity)return null;const edges=[];let c=dst;
  while(c!=src){edges.unshift(prev[c][1]);c=prev[c][0]}
  return{edges,km:edges.reduce((a,e)=>a+e.d,0),cost:dist[dst]};
}

// ---------- 3D MAP (MapLibre + OpenFreeMap, no API key) ----------
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",
  center:[101.150,4.313],zoom:14,pitch:60,bearing:-20,maxPitch:80});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}));
let ready=false;
Object.entries(N).forEach(([k,n])=>{const d=document.createElement("div");d.className="node";
  new maplibregl.Marker({element:d}).setLngLat([n[2],n[1]]).setPopup(new maplibregl.Popup({offset:10}).setText(n[0])).addTo(map)});

const roadsGeo=()=>({type:"FeatureCollection",features:E.map(e=>({type:"Feature",properties:{id:e.id,name:e[2],s:status(e)},geometry:{type:"LineString",coordinates:e.g}}))});
const routeGeo=r=>({type:"FeatureCollection",features:r?r.edges.map(e=>({type:"Feature",properties:{},geometry:{type:"LineString",coordinates:e.g}})):[]});
const setSrc=(id,d)=>{if(ready)map.getSource(id).setData(d)};

map.on("load",()=>{
  ["roads","rn","ra"].forEach(id=>map.addSource(id,{type:"geojson",data:id==="roads"?roadsGeo():routeGeo()}));
  const col=["match",["get","s"],"FLOODED",COL.FLOODED,"CAUTION",COL.CAUTION,COL.PASSABLE];
  const rd={"line-cap":"round","line-join":"round"};
  map.addLayer({id:"roads-glow",type:"line",source:"roads",layout:rd,paint:{"line-color":col,"line-width":18,"line-blur":9,"line-opacity":.6}});
  map.addLayer({id:"roads-case",type:"line",source:"roads",layout:rd,paint:{"line-color":"#fff","line-width":10}});
  map.addLayer({id:"roads",type:"line",source:"roads",layout:rd,paint:{"line-color":col,"line-width":6}});
  map.addLayer({id:"roads-flood",type:"line",source:"roads",filter:["==",["get","s"],"FLOODED"],paint:{"line-color":"#fff","line-width":2,"line-dasharray":[1,2]}});
  map.addLayer({id:"rn",type:"line",source:"rn",layout:rd,paint:{"line-color":"#777","line-width":4,"line-dasharray":[2,2]}});
  map.addLayer({id:"ra-glow",type:"line",source:"ra",layout:rd,paint:{"line-color":"#0b6bcb","line-width":20,"line-blur":10,"line-opacity":.7}});
  map.addLayer({id:"ra",type:"line",source:"ra",layout:rd,paint:{"line-color":"#1e88ff","line-width":8}});
  ready=true;refresh();findRoute(false);loadGeom();
});
map.on("mouseenter","roads",()=>map.getCanvas().style.cursor="pointer");
map.on("mouseleave","roads",()=>map.getCanvas().style.cursor="");
map.on("click",ev=>{
  const f=ready?map.queryRenderedFeatures(ev.point,{layers:["roads"]}):[];
  const html=f.length?`<b>${f[0].properties.name}</b><br>${f[0].properties.s}`:`Coords: ${ev.lngLat.lat.toFixed(5)}, ${ev.lngLat.lng.toFixed(5)}`;
  new maplibregl.Popup().setLngLat(ev.lngLat).setHTML(html).addTo(map)});

// fetch real road shapes between each pair of junctions (OSRM public demo server: light use only)
async function loadGeom(){
  const todo=E.filter(e=>!G[e.id]);if(!todo.length){$("geo").textContent="Road shapes: loaded (cached)";return}
  let n=0,fail=0;
  for(const e of todo){
    try{const a=ll(e[0]),b=ll(e[1]);
      const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a};${b}?overview=full&geometries=geojson`).then(r=>r.json());
      const rt=r.routes&&r.routes[0];
      if(rt){e.g=rt.geometry.coordinates;e.d=rt.distance/1000;G[e.id]={g:e.g,d:e.d};n++;setSrc("roads",roadsGeo())}else fail++;
    }catch(x){fail++}
    $("geo").textContent=`Road shapes: ${n}/${todo.length} loaded${fail?`, ${fail} failed (straight line used)`:""}`;
    await new Promise(r=>setTimeout(r,300));
  }
  try{localStorage.setItem("fr_geom_v1",JSON.stringify(G))}catch(x){}
  findRoute(false);
}

// ---------- UI ----------
const opts=Object.entries(N).map(([k,n])=>`<option value="${k}">${n[0]}</option>`).join("");
$("from").innerHTML=opts;$("to").innerHTML=opts;$("from").value=1;$("to").value=8;
$("rroad").innerHTML=E.map(e=>`<option value="${e.id}">${e[2]}</option>`).join("");
const nameOf=id=>E.find(e=>e.id===id)[2];

function findRoute(fit){
  const a=$("from").value,b=$("to").value,R=$("result");
  setSrc("rn",routeGeo(null));setSrc("ra",routeGeo(null));
  if(a===b){R.innerHTML='<div class="box warn">Pick different points.</div>';return}
  const normal=dijkstra(a,b,false),aware=dijkstra(a,b,true);
  if(!aware){R.innerHTML='<div class="box bad">No available route: all paths contain flooded roads.</div>';setSrc("rn",routeGeo(normal));return}
  const hit=normal.edges.filter(e=>status(e)==="FLOODED"),caut=aware.edges.filter(e=>status(e)==="CAUTION");
  setSrc("rn",routeGeo(hit.length?normal:null));setSrc("ra",routeGeo(aware));
  let h=`<div class="box ${hit.length?"warn":"ok"}">`;
  h+=hit.length?`⚠ Normal route (${normal.km.toFixed(1)} km, grey dashed) passes flooded: <b>${hit.map(e=>e[2]).join(", ")}</b>.<br><b>Alternative (blue): ${aware.km.toFixed(1)} km.</b>`
   :`✔ Normal route has no flooded road: ${aware.km.toFixed(1)} km (blue).`;
  if(caut.length)h+=`<br>Caution roads on route: ${caut.map(e=>e[2]).join(", ")}`;
  R.innerHTML=h+"</div>";
  if(fit&&ready){const bb=new maplibregl.LngLatBounds();aware.edges.forEach(e=>e.g.forEach(p=>bb.extend(p)));
    map.fitBounds(bb,{padding:90,maxZoom:16,pitch:map.getPitch()})}
}
function refresh(){setSrc("roads",roadsGeo());const c={PASSABLE:0,CAUTION:0,FLOODED:0};E.forEach(e=>c[status(e)]++);
  $("stats").innerHTML=`<div class="box info">Flooded: <b>${c.FLOODED}</b> · Caution: <b>${c.CAUTION}</b> · Passable: <b>${c.PASSABLE}</b></div>`;
  $("log").innerHTML=S.log.slice(-8).reverse().map(r=>`<tr><td>${new Date(r.t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</td><td>${nameOf(r.road)}</td><td><span class="tag" style="background:${COL[r.s]}">${r.s}</span></td><td>${r.l??""}</td></tr>`).join("")}
$("go").onclick=()=>findRoute(true);
$("tilt").onclick=()=>map.easeTo({pitch:map.getPitch()>5?0:60,bearing:map.getPitch()>5?0:-20,duration:900});
sim.onchange=()=>{refresh();findRoute(false)};
$("rsub").onclick=()=>{const road=$("rroad").value,s=$("rstat").value;
  S.st[road]=s;S.log.push({t:new Date().toISOString(),road,s,l:parseFloat($("rlvl").value)||null,by:$("rby").value});save();refresh();findRoute(false)};
$("reset").onclick=()=>{S=seed();save();refresh();findRoute(false)};

// ---------- MET MALAYSIA via data.gov.my ----------
fetch("https://api.data.gov.my/weather/warning?limit=100").then(r=>r.json()).then(list=>{
  const hits=(Array.isArray(list)?list:[]).filter(w=>/perak/i.test(JSON.stringify(w)));
  const flood=hits.filter(w=>/banjir|flood|hujan lebat|heavy rain|thunderstorm/i.test(JSON.stringify(w)));
  metActive=flood.length>0;
  const t=(flood[0]||hits[0]||{});const title=t.warning_issue?.title_en||t.text_en||"";
  $("met").className="box "+(metActive?"warn":"ok");
  $("met").innerHTML=metActive?`⚠ MET warning for Perak: ${String(title).slice(0,120)}<br>Low-lying roads treated as CAUTION.`:"✔ No active MET rain/flood warning for Perak.";
  refresh();findRoute(false);
}).catch(()=>{$("met").className="box info";$("met").textContent="MET API unreachable (offline/blocked). Use the simulate checkbox."});
refresh();
</script></body></html>
